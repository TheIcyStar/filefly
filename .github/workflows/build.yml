# Builds the project
# Runs automatically on push to main and pull requests targeting main when relevant files are changed
name: Build

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/**"
      - "src/**"
      - ".gitignore"
      - "esbuild.js"
      - "eslint.config.mjs"
      - ".package-lock.json"
      - "package.json"
      - "tsconfig.json"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/**"
      - "src/**"
      - ".gitignore"
      - "esbuild.js"
      - "eslint.config.mjs"
      - ".package-lock.json"
      - "package.json"
      - "tsconfig.json"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - run: npm run compile